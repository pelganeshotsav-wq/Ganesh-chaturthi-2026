<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPI Mobile Number Test</title>
<style>
body{font-family:Arial,sans-serif;max-width:520px;margin:40px auto;padding:20px;line-height:1.5}
.card{border:1px solid #ddd;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:8px;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{cursor:pointer;border:0;background:#111;color:#fff;margin-top:14px}
.note{font-size:14px;color:#666}
</style>
</head>
<body>
<div class="card">
<h2>UPI Mobile Number Test</h2>
<p>This is a separate test page. It does not connect to your Sheet or Apps Script.</p>

<label>Recipient mobile number</label>
<input id="mobile" value="ENTER_RECIPIENT_MOBILE_NUMBER" inputmode="numeric" maxlength="10">

<label>Amount</label>
<input id="amount" type="number" min="1" step="1" value="10">

<button onclick="openGPay()">Test Google Pay</button>

<p id="status" class="note"></p>

<hr>
<p class="note">
This test tries to open Google Pay using the recipient mobile number as the payee
and the amount entered above. It is only a test; do not use it for real donations.
</p>
</div>

<script>
function openGPay(){
  const mobile = document.getElementById("mobile").value.trim();
  const amount = document.getElementById("amount").value.trim();

  if(!/^\d{10}$/.test(mobile)){
    document.getElementById("status").textContent =
      "Please enter a valid 10-digit mobile number.";
    return;
  }

  if(!amount || Number(amount) <= 0){
    document.getElementById("status").textContent =
      "Please enter a valid amount.";
    return;
  }

  // Test only: use the mobile number as the payee address.
  const url =
    "gpay://upi/pay" +
    "?pa=" + encodeURIComponent(mobile) +
    "&pn=" + encodeURIComponent("Prestige Elysian Ganesh Chaturthi") +
    "&am=" + encodeURIComponent(Number(amount).toFixed(2)) +
    "&cu=INR";

  document.getElementById("status").textContent =
    "Trying to open Google Pay…";

  window.location.href = url;
}
</script>
</body>
</html>
