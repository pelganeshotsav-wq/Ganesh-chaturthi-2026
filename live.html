<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ganesh Chaturthi 2026 | Prestige Elysian</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:
    radial-gradient(circle at top,#fff4cf 0%,#f8d79b 35%,#d98236 100%);
  font-family:Georgia,"Times New Roman",serif;
  color:#5e241c;
  overflow-x:hidden;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.page{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:18px 12px 30px;
}

.card{
  width:100%;
  max-width:520px;
  background:
    linear-gradient(
      180deg,
      rgba(255,250,231,.96),
      rgba(255,244,210,.95)
    );
  border-radius:26px;
  box-shadow:
    0 18px 45px rgba(94,36,28,.25);
  overflow:hidden;
  position:relative;
}


/* =========================================
   HEADER
========================================= */

.header{
  text-align:center;
  padding:28px 20px 18px;
}

.om{
  font-size:24px;
  margin-bottom:5px;
}

.title{
  font-size:30px;
  font-weight:700;
  letter-spacing:.5px;
  margin:0;
}

.subtitle{
  font-size:14px;
  margin-top:7px;
  color:#8a5230;
}


/* =========================================
   SHLOKA
========================================= */

.shloka-box{
  margin:4px 18px 18px;
  padding:18px 15px;
  border-radius:18px;
  background:
    linear-gradient(
      135deg,
      #7e2f19,
      #a9461d
    );
  color:#fff5d7;
  text-align:center;
  box-shadow:
    0 8px 20px #5e241c33;
  min-height:125px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.shloka{
  font-size:17px;
  line-height:1.75;
  transition:opacity .5s ease;
}


/* =========================================
   LIVE SECTION
========================================= */

.section{
  padding:0 14px;
}

.live{
  padding:14px 12px 18px;
  border-radius:20px;
  background:
    linear-gradient(
      135deg,
      #8d351b,
      #b84e20
    );
  color:white;
  box-shadow:
    0 10px 24px #5e241c33;
}

.live-head{
  text-align:center;
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  opacity:.95;
}

.live-dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#8ff0ad;
  margin-right:5px;
  box-shadow:0 0 10px #8ff0ad;
  animation:pulse 1.5s infinite;
}


/* =========================================
   STAT CARDS
========================================= */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:13px;
}

.stat{
  background:#fff9e91a;
  border:1px solid #ffffff30;
  border-radius:17px;
  padding:15px 9px 14px;
  text-align:center;
}

.stat .num{
  font-family:Arial,sans-serif;
  font-weight:800;
  font-size:25px;
  line-height:1.15;
}

.stat .label{
  font-family:Arial,sans-serif;
  font-size:10px;
  font-weight:700;
  letter-spacing:.7px;
  margin-top:6px;
  opacity:.95;
}

.sub-progress{
  font-family:Arial,sans-serif;
  font-size:11px;
  margin-top:7px;
  opacity:.85;
}

.progress-track{
  height:7px;
  margin:9px 4px 5px;
  border-radius:10px;
  background:#ffffff30;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  border-radius:10px;
  background:
    linear-gradient(
      90deg,
      #f6c75d,
      #fff1b8
    );
  transition:width 1s ease;
}

.percentage{
  font-family:Arial,sans-serif;
  font-size:11px;
  font-weight:700;
  margin-top:5px;
}


/* =========================================
   MESSAGE
========================================= */

.target-message{
  text-align:center;
  font-family:Georgia,"Times New Roman",serif;
  font-size:13px;
  line-height:1.5;
  margin-top:14px;
  color:#fff7e2;
  opacity:.94;
}


/* =========================================
   UPDATED
========================================= */

.updated{
  text-align:center;
  font:11px Arial,sans-serif;
  margin-top:10px;
  opacity:.75;
}


/* =========================================
   CTA
========================================= */

.cta{
  padding:12px 18px 18px;
  text-align:center;
}

.cta p{
  margin:2px 0 12px;
  font-size:14px;
  color:#70452a;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px 18px;
  font:700 16px Arial,sans-serif;
  color:white;
  background:
    linear-gradient(
      135deg,
      #e48618,
      #b94313
    );
  box-shadow:
    0 7px 18px #8b3c1e33;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}


/* =========================================
   FOOTER
========================================= */

.footer{
  text-align:center;
  padding:4px 20px 22px;
  color:#8a5230;
  font-size:12px;
  line-height:1.5;
}


/* =========================================
   FLOATING PETALS
========================================= */

.floating{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.petal{
  position:absolute;
  top:-20px;
  font-size:16px;
  animation:fall linear infinite;
  opacity:.7;
}

.petal:nth-child(1){
  left:7%;
  animation-duration:9s;
}

.petal:nth-child(2){
  left:27%;
  animation-duration:12s;
  animation-delay:-5s;
}

.petal:nth-child(3){
  left:51%;
  animation-duration:10s;
  animation-delay:-2s;
}

.petal:nth-child(4){
  left:76%;
  animation-duration:13s;
  animation-delay:-7s;
}

.petal:nth-child(5){
  left:92%;
  animation-duration:11s;
  animation-delay:-3s;
}


/* =========================================
   ANIMATIONS
========================================= */

@keyframes fall{
  to{
    transform:
      translateY(110vh)
      rotate(360deg);
  }
}

@keyframes pulse{
  50%{
    opacity:.35;
    transform:scale(.8);
  }
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:390px){

  .page{
    padding:10px 8px 20px;
  }

  .card{
    border-radius:22px;
  }

  .header{
    padding:23px 15px 15px;
  }
