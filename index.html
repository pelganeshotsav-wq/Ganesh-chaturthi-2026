<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prestige Elysian | Ganesh Chaturthi Donation</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff7ed;color:#3b2415}
.wrap{max-width:560px;margin:auto;padding:18px}
.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px #0002}
.cover{width:100%;height:230px;object-fit:cover;display:block}
.content{padding:24px}
.icon{width:72px;height:72px;border-radius:50%;object-fit:cover;display:block;margin:-60px auto 12px;border:4px solid white;box-shadow:0 4px 14px #0003;position:relative}
h1{text-align:center;margin:0 0 5px;font-size:26px}
.sub{text-align:center;color:#795548;margin-bottom:22px;line-height:1.5}
label{display:block;font-weight:700;margin:15px 0 7px}
input{width:100%;padding:13px;border:1px solid #d6d6d6;border-radius:10px;font-size:16px}
input:focus{outline:2px solid #f0a040;border-color:#f0a040}
button{width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;cursor:pointer}
.pay{background:#138a45;color:#fff;margin-top:18px}.submit{background:#e87500;color:#fff;margin-top:12px}
.note{font-size:13px;color:#666;margin-top:8px;line-height:1.4}
.status{margin-top:14px;padding:12px;border-radius:10px;display:none;line-height:1.4}
.success{background:#e8f5e9;color:#1b5e20}.err{background:#ffebee;color:#b71c1c}
.invalid{border-color:#d32f2f!important}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<img class="cover" src="ganesh-cover.jpg" alt="Ganesh Chaturthi">
<div class="content">
<img class="icon" src="ganesh-icon.jpg" alt="Lord Ganesha">
<h1>🪔 Ganesh Chaturthi 2026</h1>
<div class="sub"><b>Prestige Elysian</b><br>Let’s come together to welcome Bappa 🙏</div>

<form id="donationForm" novalidate>
<label for="name">Name *</label>
<input id="name" name="name" autocomplete="name" required>

<label for="mobile">Mobile Number *</label>
<input id="mobile" name="mobile" type="tel" inputmode="numeric" maxlength="10"
pattern="[6-9][0-9]{9}" placeholder="10-digit mobile number" required>

<label for="email">Email ID *</label>
<input id="email" name="email" type="email" autocomplete="email"
placeholder="name@example.com" required>

<label for="flat">Flat Number *</label>
<input id="flat" name="flat" type="text" inputmode="numeric" maxlength="4"
placeholder="1001 - 4118" required>

<label for="amount">Donation Amount (₹) *</label>
<input id="amount" name="amount" type="number" min="1" step="1"
placeholder="Enter amount" required>

<div class="note">Flats 1001–2999 use UPI account 1. Flats 3000–4118 use UPI account 2.</div>

<button type="button" class="pay" id="pay">💳 PAY VIA UPI</button>
<div id="status" class="status"></div>

<label for="utr">UPI Transaction ID / UTR *</label>
<input id="utr" name="utr" type="text" minlength="6" maxlength="50"
placeholder="Enter transaction reference number" required>

<button class="submit" type="submit">SUBMIT DONATION</button>
<div class="note">Please complete the UPI payment before entering your UTR and submitting.</div>
</form>
</div></div>

<script>
const UPI1="9840365240@ptsbi";
const UPI2="nitrkl.avinash@okicici";
const RECIPIENT="Prestige Elysian Ganesh Chaturthi";
const form=document.getElementById("donationForm");
const statusBox=document.getElementById("status");
const mobile=document.getElementById("mobile"), email=document.getElementById("email");
const flat=document.getElementById("flat"), amount=document.getElementById("amount");

function show(type,msg){statusBox.className="status "+type;statusBox.style.display="block";statusBox.textContent=msg}
function emailOK(v){return /^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$/.test(v)}
function basic(){
  document.querySelectorAll("input").forEach(x=>x.classList.remove("invalid"));
  const name=document.getElementById("name"), f=Number(flat.value), a=Number(amount.value);
  if(!name.value.trim()){name.classList.add("invalid");show("err","Please enter your name.");name.focus();return false}
  if(!/^[6-9][0-9]{9}$/.test(mobile.value.trim())){mobile.classList.add("invalid");show("err","Please enter a valid 10-digit Indian mobile number.");mobile.focus();return false}
  if(!emailOK(email.value.trim())){email.classList.add("invalid");show("err","Please enter a valid email address.");email.focus();return false}
  if(!Number.isInteger(f)||f<1001||f>4118){flat.classList.add("invalid");show("err","Flat number must be between 1001 and 4118.");flat.focus();return false}
  if(!Number.isInteger(a)||a<1){amount.classList.add("invalid");show("err","Please enter a valid whole-number donation amount.");amount.focus();return false}
  return true
}
document.getElementById("pay").onclick=()=>{
  if(!basic())return;
  const pa=Number(flat.value)<=2999?UPI1:UPI2;
  const url=`upi://pay?pa=${encodeURIComponent(pa)}&pn=${encodeURIComponent(RECIPIENT)}&am=${Number(amount.value).toFixed(2)}&cu=INR`;
  show("success",`Opening UPI app for ₹${Number(amount.value).toLocaleString("en-IN")} payment…`);
  window.location.href=url;
};
form.onsubmit=e=>{
  e.preventDefault();
  if(!basic())return;
  const utr=document.getElementById("utr");
  if(!utr.value.trim()||utr.value.trim().length<6){utr.classList.add("invalid");show("err","Please enter a valid UPI Transaction ID / UTR.");utr.focus();return}
  const data={timestamp:new Date().toISOString(),name:document.getElementById("name").value.trim(),
    mobile:mobile.value.trim(),email:email.value.trim(),flat:Number(flat.value),
    amount:Number(amount.value),upi:Number(flat.value)<=2999?UPI1:UPI2,utr:utr.value.trim()};
  localStorage.setItem("lastDonation",JSON.stringify(data));
  show("success","🙏 Thank you for your contribution! Your donation details are ready to be connected to the Google Sheet.");
};
</script>
</body></html>
